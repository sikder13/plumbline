# The sweep: Google Places Text Search for businesses that already have a profile and may have no website.
# One query per term per area, up to three pages of 20. Each area is a location bias, not a hard edge.

terms:
  beauty: [barber shop, hair salon, nail salon, lash studio, braiding salon, tattoo studio]
  food: [taqueria, food truck, bakery, coffee shop, pizza, soul food restaurant]
  auto_home: [auto detailing, tire shop, mechanic, lawn care, pressure washing, house cleaning]

# Cities, each split into areas so queries reach different parts of town. Radius in kilometres.
cities:
  indianapolis:
    name: Indianapolis
    areas:
      - { id: downtown, label: Downtown, lat: 39.7684, lng: -86.1581, radiusKm: 8 }
